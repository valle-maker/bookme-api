services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: bookme_root_pass
      MYSQL_DATABASE: bookme_db
    ports:
      - "3307:3306"
    volumes:
      - bookme_data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/bookme_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: bookme_root_pass
    depends_on:
      - db

volumes:
  bookme_data: